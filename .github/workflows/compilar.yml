name: Compilar instalador Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "yt-dlp[default]" imageio-ffmpeg deno

      - name: Preparar ffmpeg, deno y versión
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $ff bin\ffmpeg.exe
          $dn = python -c "import deno; print(deno.find_deno_bin())"
          Copy-Item $dn bin\deno.exe
          python -c "import yt_dlp.version as v; open('motor_incluido.txt','w').write(v.__version__)"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart("v") }
          else { $ver = python -c "import re; print(re.search(r'APP_VERSION = \x22(.+?)\x22', open('descargador_youtube.pyw', encoding='utf-8').read()).group(1))" }
          "APP_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versión: $ver"

      - name: Compilar con PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name DescargadorYouTube --icon icono.ico
          --add-binary "bin\ffmpeg.exe;bin" --add-binary "bin\deno.exe;bin"
          --add-data "motor_incluido.txt;."
          --collect-all yt_dlp_ejs
          --exclude-module imageio_ffmpeg --exclude-module deno
          descargador_youtube.pyw

      - name: Crear instalador con Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VER" instalador.iss

      - name: Guardar instalador (pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: DescargadorYouTube-Setup
          path: Output/DescargadorYouTube-Setup.exe

      - name: Publicar en Releases (solo con etiqueta)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/DescargadorYouTube-Setup.exe
